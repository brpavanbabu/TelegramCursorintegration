name: Sentinel Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Sentinel framework is zero-dependency: no npm install needed.
      # (The bot's runtime deps — robotjs, node-telegram-bot-api — are
      # stubbed by the sandbox loader, so tests run on any OS.)
      - name: Run full autonomous test pipeline
        run: node testframework/cli.js all --json --junit --html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-reports
          path: .testreports/
